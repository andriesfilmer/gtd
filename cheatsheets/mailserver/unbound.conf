server:
    interface: 127.0.0.1
    access-control: 127.0.0.0/8 allow
    do-ip4: yes
    do-ip6: no    # IPv6 disabled on these hosts. Without an explicit
                  # interface: line unbound also binds ::1 and refuses to
                  # start: "can't bind socket ... could not open ports".
                  # Same reason as inet_protocols=ipv4 in Postfix main.cf.
    num-threads: 2
    so-reuseport: yes
    prefetch: yes
    cache-max-ttl: 86400
    cache-min-ttl: 0    # never inflate TTLs on a mailserver: DNSBL entries
                        # use short TTLs so delistings take effect quickly
    hide-identity: yes
    hide-version: yes

# Trust anchor comes from the packaged drop-in below — do NOT also declare
# auto-trust-anchor-file here, or unbound fails with "trust anchor
# presented twice" and the validator module won't load.
include-toplevel: "/etc/unbound/unbound.conf.d/*.conf"

# No forward-zone: full recursion, so DNSBL/DNSWL queries originate from
# this server's own IP. Spamhaus and Barracuda refuse queries relayed via
# public resolvers, and that failure is silent.

